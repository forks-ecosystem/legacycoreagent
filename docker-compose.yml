services:
  legacycoreagent:
    build:
      context: ../legacycore
      dockerfile: ../legacycoreagent/Dockerfile
    container_name: legacycoreagent
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LEGACYCOIN_PORT:-8444}:${LEGACYCOIN_PORT:-8444}"
    env_file:
      - .env
    volumes:
      - /home/coin/.legacycoin:/data
