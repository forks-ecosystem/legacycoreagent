services:
  legacycoreagent:
    build:
      context: ../legacycore
      dockerfile: ../legacycoreagent/Dockerfile
    container_name: legacycoreagent
    user: "1000:1000"
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - /home/coin/.legacycoin:/data
